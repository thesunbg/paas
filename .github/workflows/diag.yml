name: diag
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 202.92.6.129
      PORT: "24700"
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Diagnose
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -p $PORT root@$HOST 'bash -s' <<'SH'
          set +e
          . /etc/paas/db.env
          hostname; sha256sum /usr/local/bin/paasd; ls -la /usr/local/bin/paasd
          psql "$PAAS_DATABASE_URL" -XAtc "select name,address,status,version,last_seen_at from nodes"
          psql "$PAAS_DATABASE_URL" -XAtc "select s.slug,p.slug,i.status,n.name from instances i join services s on s.id=i.service_id join projects p on p.id=s.project_id join nodes n on n.id=i.node_id where s.slug in ('web','server') order by i.created_at desc limit 6"
          SH
