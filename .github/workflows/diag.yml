name: diag
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 202.92.6.129
      PORT: "24700"
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Diagnose
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -p $PORT root@$HOST 'bash -s' <<'SH'
          set +e
          . /etc/paas/db.env
          iptables -w -S DOCKER-USER
          SP=$(psql "$PAAS_DATABASE_URL" -XAtc "select i.ip from instances i join services s on s.id=i.service_id where s.slug='shared-postgres' and i.status='running' limit 1")
          C=$(psql "$PAAS_DATABASE_URL" -XAtc "select i.container_id from instances i join services s on s.id=i.service_id where s.slug='net-empire' and i.status='running' limit 1")
          PID=$(ctr -n paas tasks ls | awk -v c="$C" '$1==c{print $2}')
          nsenter -t $PID -n bash -c "timeout 3 bash -c '</dev/tcp/$SP/5432' && echo app-to-shared-postgres-OK || echo app-to-shared-postgres-FAIL"
          SH
