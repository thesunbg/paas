name: diag
on:
  push:
    branches: [diag]
jobs:
  dbweb-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: git clone --depth 1 https://github.com/thesunbg/dbweb /tmp/dbweb
      - run: docker build -t dbweb-test /tmp/dbweb
      - name: Run embedded and probe the guard
        run: |
          docker run -d --name dbweb -p 4317:4317 -e DBWEB_EMBED_TOKEN=test-token-1234567890 \
            -e DBWEB_CONNECTIONS='[{"id":"paas-1","name":"x","kind":"postgres","host":"127.0.0.1","port":5432}]' dbweb-test
          for i in $(seq 1 60); do curl -sf localhost:4317/api/health && break; sleep 2; done
          echo; docker logs dbweb 2>&1 | tail -20
          echo "--- no token:"; curl -s localhost:4317/api/connections; echo
          echo "--- token:"; curl -s -H 'x-dbweb-token: test-token-1234567890' localhost:4317/api/connections; echo
          echo "--- ui:"; curl -s -H 'x-dbweb-token: test-token-1234567890' localhost:4317/ | head -c 200; echo
          docker images dbweb-test
