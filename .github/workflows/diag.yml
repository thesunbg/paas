name: diag
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 202.92.6.129
      PORT: "24700"
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Diagnose
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -p $PORT root@$HOST 'bash -s' <<'SH'
          set +e
          . /etc/paas/db.env
          C=$(psql "$PAAS_DATABASE_URL" -XAtc "select i.container_id from instances i join services s on s.id=i.service_id where s.slug='giaphaviet' and i.status='running' order by i.created_at desc limit 1")
          echo "-- $C"; tail -n 60 /var/lib/paas/containers/$C/output.log | cut -c1-400
          ls -la /var/lib/paas/volumes/$(psql "$PAAS_DATABASE_URL" -XAtc "select id from services where slug='giaphaviet'")/data
          SH
