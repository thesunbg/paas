name: diag
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 202.92.6.129
      PORT: "24700"
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Diagnose
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -p $PORT root@$HOST 'bash -s' <<'SH'
          set +e
          . /etc/paas/db.env
          psql "$PAAS_DATABASE_URL" -X -P pager=off -c "select s.slug, n.name, i.status, i.container_id, i.created_at from instances i join services s on s.id=i.service_id left join nodes n on n.id=i.node_id where s.slug in ('n8n','giaphaviet','wordpress') order by i.created_at desc"
          for c in $(psql "$PAAS_DATABASE_URL" -XAtc "select i.container_id from instances i join services s on s.id=i.service_id join nodes n on n.id=i.node_id where s.slug='n8n' and n.address='202.92.6.129' order by i.created_at desc limit 1"); do echo "-- $c"; grep -vE "Starting migration|Finished migration" /var/lib/paas/containers/$c/output.log | tail -n 40; grep -c "Finished migration" /var/lib/paas/containers/$c/output.log; done
          SH
