name: diag
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 202.92.6.129
      PORT: "24700"
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Diagnose
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -p $PORT root@$HOST 'bash -s' <<'SH'
          set +e
          . /etc/paas/db.env
          psql "$PAAS_DATABASE_URL" -X -P pager=off -c "select d.status, d.trigger, d.detected, left(d.error,200) err, d.created_at from deployments d join services s on s.id=d.service_id where s.slug='giaphaviet' order by d.created_at desc limit 4"
          psql "$PAAS_DATABASE_URL" -X -P pager=off -c "select e.key from env_vars e join services s on s.id=e.service_id where s.slug='giaphaviet'"
          psql "$PAAS_DATABASE_URL" -X -P pager=off -c "select spec->'volumes' vols, build from services where slug='giaphaviet'"
          D=$(psql "$PAAS_DATABASE_URL" -XAtc "select d.id from deployments d join services s on s.id=d.service_id where s.slug='giaphaviet' order by d.created_at desc limit 1")
          psql "$PAAS_DATABASE_URL" -XAtc "select line from deployment_logs where deployment_id='$D' order by id" 2>/dev/null | grep -iE "prisma|==>|error" | tail -25
          SH
