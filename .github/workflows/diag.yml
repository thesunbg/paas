name: diag
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: 202.92.6.129
      PORT: "24700"
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Diagnose
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no -p $PORT root@$HOST 'bash -s' <<'SH'
          set +e
          . /etc/paas/db.env
          q() { psql "$PAAS_DATABASE_URL" -X -P pager=off -c "$1"; }
          echo "== nodes"; q "select name, address, status, roles, last_seen_at, net_index from nodes"
          echo "== databases"; q "select d.name, d.engine, d.mode, d.status, left(d.error,200) err, s.slug server from databases d left join services s on s.id=d.server_service_id"
          echo "== services"; q "select s.slug, p.slug proj, s.type, s.status, n.name pin from services s join projects p on p.id=s.project_id left join nodes n on n.id=s.node_id order by p.slug, s.slug"
          echo "== instances"; q "select s.slug, n.name node, i.ip, i.port, i.status, i.restarts from instances i join services s on s.id=i.service_id left join nodes n on n.id=i.node_id order by s.slug"
          echo "== wordpress deployments"; q "select d.status, left(d.error,300) err, d.created_at from deployments d join services s on s.id=d.service_id where s.slug like 'wordpress%' order by d.created_at desc limit 3"
          echo "== connectivity from control plane"
          for ip in $(psql "$PAAS_DATABASE_URL" -XAtc "select i.ip||':'||i.port from instances i join services s on s.id=i.service_id where s.type='database' and i.status='running'"); do
            h=${ip%:*}; p=${ip#*:}; timeout 3 bash -c "</dev/tcp/$h/$p" && echo "ok $ip" || echo "FAIL $ip"; done
          for ip in $(psql "$PAAS_DATABASE_URL" -XAtc "select i.ip||':'||i.port from instances i join services s on s.id=i.service_id where s.slug like 'wordpress%' and i.status='running'"); do
            h=${ip%:*}; p=${ip#*:}; timeout 3 bash -c "</dev/tcp/$h/$p" && echo "ok wp $ip" || echo "FAIL wp $ip"; done
          echo "== mesh"; ip -br addr show paaswg0; ip route | grep -E "paaswg0|10\.10" | head; ping -c2 -W2 10.102.255.254 | tail -2
          echo "== wordpress container log (if local)"
          for c in $(psql "$PAAS_DATABASE_URL" -XAtc "select i.container_id from instances i join services s on s.id=i.service_id join nodes n on n.id=i.node_id where s.slug like 'wordpress%' and n.address='202.92.6.129' order by i.created_at desc limit 1"); do
            tail -n 30 /var/lib/paas/containers/$c/output.log 2>/dev/null || ls /var/lib/paas/containers | head -3; done
          echo "== paasd errors"; journalctl -u paasd --since "-2h" --no-pager | grep -iE "error|warn" | grep -viE "password|token" | tail -40
          SH
