name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # VERSION is the tag (vX.Y.Z): baked into the binaries, compared by the update check.
      # make release also writes dist/SHA256SUMS, which control planes verify downloads against.
      - run: make release VERSION=${{ github.ref_name }}
      - run: test -s dist/SHA256SUMS && cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
