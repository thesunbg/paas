name: deploy

# Installs (or upgrades) paas on a server over SSH as the unprivileged user `deploy`,
# which may sudo only /usr/local/sbin/paas-deploy (see scripts/paas-deploy-setup.sh).
#
# Repository secrets: DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (pinned host key line).
# Repository variables: PAAS_DEPLOY_HOST, PAAS_DEPLOY_PORT, PAAS_DEPLOY_USER, PAAS_DOMAIN,
#   PAAS_DASHBOARD_DOMAIN, PAAS_HTTPS (default true), PAAS_EMAIL.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HOST: ${{ vars.PAAS_DEPLOY_HOST }}
      PORT: ${{ vars.PAAS_DEPLOY_PORT }}
      USER_NAME: ${{ vars.PAAS_DEPLOY_USER }}
      DOMAIN: ${{ vars.PAAS_DOMAIN }}
      DASHBOARD_DOMAIN: ${{ vars.PAAS_DASHBOARD_DOMAIN }}
      HTTPS: ${{ vars.PAAS_HTTPS || 'true' }}
      EMAIL: ${{ vars.PAAS_EMAIL }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare SSH
        run: |
          for v in HOST PORT USER_NAME SSH_KEY KNOWN_HOSTS; do
            [ -n "$(printenv "$v")" ] || { echo "::error::$v is not set (see the header of this workflow)"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p $PORT" >> "$GITHUB_ENV"

      - name: Check server
        run: |
          ssh $SSH_OPTS "$USER_NAME@$HOST" 'uname -a; head -2 /etc/os-release; nproc; free -m | head -2; df -h / | tail -1'
          ARCH=$(ssh $SSH_OPTS "$USER_NAME@$HOST" 'uname -m')
          case "$ARCH" in x86_64|amd64) GOARCH=amd64;; aarch64|arm64) GOARCH=arm64;; *) echo "::error::unsupported arch $ARCH"; exit 1;; esac
          echo "GOARCH=$GOARCH" >> "$GITHUB_ENV"

      - name: Build paasd and paas
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH go build -trimpath -ldflags "-s -w" -o dist/paasd ./cmd/paasd
          CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH go build -trimpath -ldflags "-s -w" -o dist/paas ./cmd/paas
          ls -la dist

      - name: Upload
        run: |
          SCP_OPTS=$(echo "$SSH_OPTS" | sed 's/-p /-P /')
          scp $SCP_OPTS dist/paasd dist/paas internal/installer/install.sh "$USER_NAME@$HOST:stage/"

      - name: Install
        run: |
          ARGS=""
          [ -n "$DOMAIN" ] && ARGS="$ARGS --domain $DOMAIN"
          [ "$HTTPS" = true ] && ARGS="$ARGS --https"
          [ -n "$DASHBOARD_DOMAIN" ] && ARGS="$ARGS --dashboard-domain $DASHBOARD_DOMAIN"
          [ -n "$EMAIL" ] && ARGS="$ARGS --email $EMAIL"
          ssh $SSH_OPTS "$USER_NAME@$HOST" "sudo /usr/local/sbin/paas-deploy$ARGS"

      - name: Verify
        run: |
          ssh $SSH_OPTS "$USER_NAME@$HOST" '
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 2; done; echo
            systemctl --no-pager --lines=0 status paasd containerd buildkit | grep -E "●|Active:"
            journalctl -u paasd --no-pager -n 25'
